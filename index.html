<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta content="width=device-width, initial-scale=1.0" name="viewport">

		<title>Lorenzo Apolloni | Custom software</title>
		<meta
			content="I'm Lorenzo. I build software for the parts of a business that are still done by hand. You don't need to arrive with a plan. Tell me what isn't working and we'll work out the rest."
			name="description"
		>

		<link href="/logo.svg" rel="icon" type="image/svg+xml">
		<meta content="#0c0c0e" media="(prefers-color-scheme: dark)" name="theme-color">
		<meta content="#fbfbfa" media="(prefers-color-scheme: light)" name="theme-color">

		<meta content="website" property="og:type">
		<meta content="Lorenzo Apolloni" property="og:site_name">
		<meta content="Lorenzo Apolloni | Custom software" property="og:title">
		<meta
			content="I build software for the parts of a business that are still done by hand. You don't need to arrive with a plan. Tell me what isn't working and we'll work out the rest."
			property="og:description"
		>
		<meta content="summary_large_image" name="twitter:card">

		<link href="https://fonts.googleapis.com" rel="preconnect">
		<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		>

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Lorenzo Apolloni",
				"jobTitle": "Senior Software Engineer",
				"description": "Builds software for the parts of a business that are still done by hand.",
				"sameAs": ["https://github.com/lorenzo-ap", "https://www.linkedin.com/in/lorenzo-apl/"]
			}
		</script>

		<script>
		'use strict';
		// Applied before first paint so the theme never flashes.
		(() => {
			const stored = localStorage.getItem('theme');
			document.documentElement.classList.add(stored === 'light' ? 'light' : 'dark');
		})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script src="/src/main.tsx" type="module"></script>
	</body>
</html>
